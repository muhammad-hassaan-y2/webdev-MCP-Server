<div id="physics-widget" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 100%; margin: 0 auto; color: #f8fafc; background: #070b14; border-radius: 12px; border: 1px solid #1e293b; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);">
  <style>
    #physics-widget * { box-sizing: border-box; }
    #physics-widget .physics-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; background: #0f172a; border-bottom: 1px solid #1e293b;
    }
    #physics-widget .physics-title { font-size: 14px; font-weight: 700; color: #38bdf8; margin: 0; }
    #physics-widget .physics-desc { font-size: 11px; color: #94a3b8; margin: 2px 0 0; }
    #physics-widget .hud-badges { display: flex; gap: 8px; font-size: 11px; }
    #physics-widget .hud-badge {
      background: #1e293b; padding: 4px 8px; border-radius: 4px; border: 1px solid #334155; color: #cbd5e1;
    }
    #physics-widget canvas#physics-canvas {
      width: 100%; height: 340px; display: block; background: #050811; cursor: crosshair;
    }
    #physics-widget .physics-toolbar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      padding: 10px 16px; background: #0f172a; border-top: 1px solid #1e293b;
    }
    #physics-widget .btn-group { display: flex; gap: 6px; align-items: center; }
    #physics-widget .btn {
      font-size: 11px; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc; cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    #physics-widget .btn:hover { background: #334155; }
    #physics-widget .btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    #physics-widget .btn.action { background: #e11d48; border-color: #f43f5e; color: #fff; }
    #physics-widget .btn.action:hover { background: #be123c; }
    #physics-widget #physics-tip {
      padding: 6px 16px; background: #090e17; font-size: 11px; color: #38bdf8;
      border-top: 1px solid #1e293b; display: flex; justify-content: space-between;
    }
  </style>

  <div class="physics-header">
    <div>
      <h3 class="physics-title" id="physics-title">3D Rigid-Body Physics Playground</h3>
      <p class="physics-desc" id="physics-desc">Real-time Cannon-es Collision Dynamics</p>
    </div>
    <div class="hud-badges">
      <div class="hud-badge" id="badge-bodies">Bodies: 0</div>
      <div class="hud-badge" id="badge-gravity">Gravity: -9.8 m/s²</div>
    </div>
  </div>

  <canvas id="physics-canvas"></canvas>

  <div id="physics-tip">
    <span>🎯 <b>Tip:</b> Click anywhere on the scene to blast a heavy cannonball!</span>
    <span>Drag to rotate view</span>
  </div>

  <div class="physics-toolbar">
    <div class="btn-group">
      <span style="font-size: 11px; color: #94a3b8;">Gravity:</span>
      <button class="btn active" data-g="earth">🌍 Earth</button>
      <button class="btn" data-g="moon">🌕 Moon</button>
      <button class="btn" data-g="zero_g">🌌 Zero-G</button>
      <button class="btn" data-g="jupiter">🪐 Jupiter</button>
    </div>

    <div class="btn-group">
      <button class="btn action" id="btn-cannonball">💥 Cannonball</button>
      <button class="btn" id="btn-spawn-box">📦 +Box</button>
      <button class="btn" id="btn-spawn-sphere">⚪ +Sphere</button>
      <button class="btn" id="btn-reset">🔄 Reset</button>
    </div>
  </div>
</div>
<!--WIDGET_SCRIPT-->
