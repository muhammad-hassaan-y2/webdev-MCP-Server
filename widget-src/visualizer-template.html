<div id="visualizer-widget" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 100%; margin: 0 auto; color: #e0e0e0;">
  <style>
    #visualizer-widget { position: relative; background: #1a1a2e; border-radius: 12px; overflow: hidden; }
    #visualizer-widget .viz-header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      padding: 12px 16px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    }
    #visualizer-widget .viz-header h2 { font-size: 15px; margin: 0 0 2px; color: #fff; font-weight: 600; }
    #visualizer-widget .viz-header p { font-size: 12px; margin: 0; color: rgba(255,255,255,0.7); }
    #visualizer-widget #scene-canvas { width: 100%; height: 360px; display: block; cursor: grab; }
    #visualizer-widget #scene-canvas:active { cursor: grabbing; }
    #visualizer-widget .viz-controls {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      padding: 8px 16px; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(255,255,255,0.6);
    }
    #visualizer-widget .viz-controls button {
      font-size: 11px; padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1); color: #fff; cursor: pointer;
    }
    #visualizer-widget .viz-controls button:hover { background: rgba(255,255,255,0.2); }
    #visualizer-widget .label-tooltip {
      position: absolute; padding: 4px 8px; background: rgba(0,0,0,0.8); color: #fff;
      font-size: 11px; border-radius: 4px; pointer-events: none; display: none; z-index: 20;
    }
    #visualizer-widget .viz-loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.5); font-size: 14px;
    }
  </style>

  <div class="viz-header">
    <h2 id="viz-title">Loading 3D scene…</h2>
    <p id="viz-description"></p>
  </div>

  <canvas id="scene-canvas"></canvas>

  <div class="viz-controls">
    <button id="reset-btn">Reset View</button>
    <button id="toggle-anim-btn">Pause</button>
    <span id="viz-info">Drag to rotate • Scroll to zoom</span>
  </div>

  <div class="label-tooltip" id="label-tooltip"></div>
  <div class="viz-loading" id="viz-loading">Generating 3D scene…</div>
</div>
<!--WIDGET_SCRIPT-->
