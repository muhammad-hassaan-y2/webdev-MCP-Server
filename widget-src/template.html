<div id="tutor-widget" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 640px; margin: 0 auto; color: #1a1a1a;">
  <style>
    #tutor-widget h2 { font-size: 16px; margin: 0 0 2px; }
    #tutor-widget .concept { font-size: 12px; color: #666; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.02em; }
    #tutor-widget .description { font-size: 14px; line-height: 1.5; margin: 0 0 12px; color: #333; }

    #tutor-widget textarea#code {
      width: 100%; box-sizing: border-box; min-height: 160px; font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 13px; line-height: 1.5; padding: 10px; border-radius: 8px; border: 1px solid #d8d8d8;
      background: #fafafa; resize: vertical;
    }
    #tutor-widget .actions { display: flex; gap: 8px; margin: 10px 0; }
    #tutor-widget button {
      font-size: 13px; padding: 8px 14px; border-radius: 6px; border: 1px solid transparent; cursor: pointer;
    }
    #tutor-widget button.primary { background: #1a1a1a; color: #fff; }
    #tutor-widget button.secondary { background: #fff; color: #1a1a1a; border-color: #d8d8d8; }
    #tutor-widget .status { min-height: 18px; font-size: 13px; margin: 6px 0 10px; }
    #tutor-widget .status.good { color: #1a7f37; }
    #tutor-widget .status.bad { color: #b3261e; }
    #tutor-widget #hint-box { font-size: 13px; color: #444; background: #f5f5f0; border-radius: 8px; padding: 10px; min-height: 14px; margin-bottom: 12px; }

    #tutor-widget #tests { display: flex; flex-direction: column; gap: 6px; }
    #tutor-widget .test-row { display: flex; align-items: center; gap: 8px; font-size: 13px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
    #tutor-widget .test-row .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: #ccc; }
    #tutor-widget .test-row.pass .dot { background: #1a7f37; }
    #tutor-widget .test-row.fail .dot { background: #b3261e; }

    #tutor-widget .param-row { margin-bottom: 10px; }
    #tutor-widget .param-row label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    #tutor-widget .param-row input[type=range] { width: 100%; }
    #tutor-widget canvas#trajectory { width: 100%; height: 180px; border-radius: 8px; background: #f5f7fa; border: 1px solid #e3e6ea; }
    #tutor-widget .answer-row { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
    #tutor-widget .answer-row input[type=number] { flex: 1; font-size: 14px; padding: 8px 10px; border-radius: 6px; border: 1px solid #d8d8d8; }
  </style>

  <h2 id="title">Loading mission…</h2>
  <p class="concept" id="concept"></p>
  <p class="description" id="description"></p>

  <div id="mission-body"></div>

  <div class="status" id="status"></div>
  <div id="hint-box"></div>
</div>
<!--WIDGET_SCRIPT-->
