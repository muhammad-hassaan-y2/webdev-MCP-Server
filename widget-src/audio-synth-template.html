<div id="synth-widget" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 100%; margin: 0 auto; color: #f8fafc; background: #090d16; border-radius: 12px; border: 1px solid #1e293b; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);">
  <style>
    #synth-widget * { box-sizing: border-box; }
    #synth-widget .synth-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; background: #0f172a; border-bottom: 1px solid #1e293b;
    }
    #synth-widget .synth-title { font-size: 14px; font-weight: 700; color: #38bdf8; margin: 0; }
    #synth-widget .synth-desc { font-size: 11px; color: #94a3b8; margin: 2px 0 0; }
    #synth-widget canvas#oscilloscope {
      width: 100%; height: 160px; display: block; background: #040711;
    }
    #synth-widget .controls-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px;
      padding: 14px 18px; background: #0b1120; border-top: 1px solid #1e293b;
    }
    #synth-widget .control-card {
      background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #1e293b;
    }
    #synth-widget .control-label {
      display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: 500;
    }
    #synth-widget input[type=range] { width: 100%; accent-color: #38bdf8; }
    #synth-widget .wave-btns {
      display: flex; gap: 4px; padding: 10px 18px; background: #0b1120; border-top: 1px solid #1e293b;
    }
    #synth-widget .wave-btn {
      flex: 1; font-size: 11px; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155;
      background: #1e293b; color: #cbd5e1; cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    #synth-widget .wave-btn:hover { background: #334155; color: #f8fafc; }
    #synth-widget .wave-btn.active {
      background: #0284c7; border-color: #38bdf8; color: #ffffff;
    }
    #synth-widget .piano-keyboard {
      display: flex; gap: 4px; padding: 12px 18px; background: #070b14; border-top: 1px solid #1e293b;
    }
    #synth-widget .piano-key {
      flex: 1; height: 64px; background: #f8fafc; color: #0f172a; border-radius: 0 0 6px 6px;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
      padding-bottom: 6px; font-size: 11px; font-weight: 700; cursor: pointer; user-select: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.05s, background 0.1s;
    }
    #synth-widget .piano-key:active, #synth-widget .piano-key.pressed {
      background: #38bdf8; color: #ffffff; transform: translateY(2px);
    }
    #synth-widget .key-freq { font-size: 9px; font-weight: 400; color: #64748b; }
    #synth-widget .piano-key:active .key-freq { color: #e0f2fe; }
    #synth-widget .play-status {
      font-size: 11px; color: #38bdf8; padding: 4px 8px; background: #082f49; border-radius: 4px; border: 1px solid #0284c7;
    }
  </style>

  <div class="synth-top">
    <div>
      <h3 class="synth-title" id="synth-name">Web Audio Synthesizer</h3>
      <p class="synth-desc" id="synth-preset-desc">Interactive Oscilloscope & Harmonic Synthesizer</p>
    </div>
    <div class="play-status" id="audio-indicator">Click keys or drag sliders to play</div>
  </div>

  <canvas id="oscilloscope"></canvas>

  <div class="wave-btns">
    <button class="wave-btn active" data-wave="sawtooth">Sawtooth ⧘</button>
    <button class="wave-btn" data-wave="sine">Sine ∿</button>
    <button class="wave-btn" data-wave="square">Square ⊓</button>
    <button class="wave-btn" data-wave="triangle">Triangle ⋀</button>
  </div>

  <div class="controls-grid">
    <div class="control-card">
      <div class="control-label"><span>Pitch (Hz)</span><span id="val-pitch">220 Hz</span></div>
      <input type="range" id="param-pitch" min="65" max="880" step="1" value="220">
    </div>
    <div class="control-card">
      <div class="control-label"><span>Filter Cutoff</span><span id="val-filter">1800 Hz</span></div>
      <input type="range" id="param-filter" min="100" max="6000" step="50" value="1800">
    </div>
    <div class="control-card">
      <div class="control-label"><span>Volume</span><span id="val-vol">70%</span></div>
      <input type="range" id="param-vol" min="0" max="100" step="5" value="70">
    </div>
  </div>

  <div class="piano-keyboard">
    <div class="piano-key" data-freq="261.63"><span>C4</span><span class="key-freq">262</span></div>
    <div class="piano-key" data-freq="293.66"><span>D4</span><span class="key-freq">294</span></div>
    <div class="piano-key" data-freq="329.63"><span>E4</span><span class="key-freq">330</span></div>
    <div class="piano-key" data-freq="349.23"><span>F4</span><span class="key-freq">349</span></div>
    <div class="piano-key" data-freq="392.00"><span>G4</span><span class="key-freq">392</span></div>
    <div class="piano-key" data-freq="440.00"><span>A4</span><span class="key-freq">440</span></div>
    <div class="piano-key" data-freq="493.88"><span>B4</span><span class="key-freq">494</span></div>
    <div class="piano-key" data-freq="523.25"><span>C5</span><span class="key-freq">523</span></div>
  </div>
</div>
<!--WIDGET_SCRIPT-->
