<div id="sandbox-widget" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 100%; margin: 0 auto; color: #1e293b; background: #ffffff; border-radius: 10px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    #sandbox-widget * { box-sizing: border-box; }
    #sandbox-widget .sandbox-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;
    }
    #sandbox-widget .sandbox-title { font-size: 13px; font-weight: 600; color: #0f172a; margin: 0; }
    #sandbox-widget .sandbox-toolbar { display: flex; gap: 6px; align-items: center; }
    #sandbox-widget .sandbox-toolbar button {
      font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid #cbd5e1;
      background: #ffffff; color: #475569; cursor: pointer; transition: all 0.15s;
    }
    #sandbox-widget .sandbox-toolbar button:hover { background: #f1f5f9; color: #0f172a; }
    #sandbox-widget .sandbox-tabs {
      display: flex; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; padding: 0 8px;
    }
    #sandbox-widget .tab-btn {
      padding: 8px 14px; font-size: 12px; font-weight: 500; border: none; background: transparent;
      color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    #sandbox-widget .tab-btn.active {
      color: #0284c7; border-bottom-color: #0284c7; background: #ffffff;
      border-top-left-radius: 6px; border-top-right-radius: 6px;
    }
    #sandbox-widget .content-view { display: none; width: 100%; min-height: 280px; }
    #sandbox-widget .content-view.active { display: block; }
    #sandbox-widget iframe#preview-frame {
      width: 100%; height: 320px; border: none; background: #ffffff; display: block;
      transition: width 0.2s ease-in-out; margin: 0 auto;
    }
    #sandbox-widget .code-editor {
      width: 100%; height: 320px; font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12px; line-height: 1.5; padding: 12px; border: none; background: #0f172a;
      color: #f8fafc; resize: none; outline: none; white-space: pre;
    }
    #sandbox-widget .frame-wrapper {
      background: #f8fafc; display: flex; justify-content: center; overflow-x: auto;
    }
  </style>

  <div class="sandbox-header">
    <h3 class="sandbox-title" id="sandbox-title">Web Component Preview</h3>
    <div class="sandbox-toolbar">
      <button id="view-desktop" title="Desktop view">🖥️ Desktop</button>
      <button id="view-mobile" title="Mobile view">📱 Mobile</button>
      <button id="reload-btn" title="Reload preview">🔄 Reload</button>
    </div>
  </div>

  <div class="sandbox-tabs">
    <button class="tab-btn active" data-tab="preview">Preview</button>
    <button class="tab-btn" data-tab="html">HTML</button>
    <button class="tab-btn" data-tab="css">CSS</button>
    <button class="tab-btn" data-tab="js">JavaScript</button>
  </div>

  <div class="content-view active" id="view-preview">
    <div class="frame-wrapper">
      <iframe id="preview-frame" sandbox="allow-scripts allow-modals"></iframe>
    </div>
  </div>

  <div class="content-view" id="view-html">
    <textarea class="code-editor" id="code-html" spellcheck="false"></textarea>
  </div>

  <div class="content-view" id="view-css">
    <textarea class="code-editor" id="code-css" spellcheck="false"></textarea>
  </div>

  <div class="content-view" id="view-js">
    <textarea class="code-editor" id="code-js" spellcheck="false"></textarea>
  </div>
</div>
<!--WIDGET_SCRIPT-->
